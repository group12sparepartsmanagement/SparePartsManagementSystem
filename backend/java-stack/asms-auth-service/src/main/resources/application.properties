# ===================================
# ASMS Auth Service Configuration
# ===================================

spring.application.name=asms-auth-service
server.port=8081

# ===================================
# DATABASE CONFIGURATION
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/asms_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================
# JWT Configuration
# ===================================
# Secret: 64-byte Base64-encoded random key (replace with env variable in production)
app.jwt.secret=M2NmYTc2ZWYxNDkzN2MxYzBlYTUxOWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGJjZDBhNzU2N2MyNzJlMDA3Yg==
# Access token expiry: 24 hours (ms)
app.jwt.access-token-expiration=86400000
# Refresh token expiry: 7 days (ms)
app.jwt.refresh-token-expiration=604800000

# ===================================
# Logging
# ===================================
logging.level.com.asms=DEBUG
logging.level.org.springframework.security=WARN
